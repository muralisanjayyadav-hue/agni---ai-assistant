  <!-- Gastric Rugae (internal folds) -->
  <path d="M62 90 Q75 110 70 135" stroke="#ffe4e6" stroke-width="2.2" fill="none" stroke-linecap="round" />
  <path d="M80 98 Q92 120 88 150" stroke="#ffe4e6" stroke-width="2.2" fill="none" stroke-linecap="round" />
  <path d="M98 115 Q115 135 120 152" stroke="#ffe4e6" stroke-width="2.2" fill="none" stroke-linecap="round" />
  <!-- Stomach shine highlight -->
  <path d="M54 85 C50 110, 60 145, 88 162" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.4" />
</svg>