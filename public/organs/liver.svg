<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="liverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d150b" />
      <stop offset="100%" stop-color="#120703" />
    </linearGradient>
    <linearGradient id="liverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="40%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <linearGradient id="gallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="24" fill="url(#liverBg)" />
  <!-- Gallbladder -->
  <ellipse cx="120" cy="148" rx="14" ry="18" fill="url(#gallGrad)" transform="rotate(15 120 148)" />
  <path d="M122 132 C120 120, 116 112, 112 108" stroke="#84cc16" stroke-width="3" fill="none" stroke-linecap="round" />
  <!-- Liver Main Body (Wedge / Triangular organ) -->
  <path d="M38 78 C42 62, 70 54, 112 56 C152 58, 172 72, 175 92 C178 114, 168 135, 142 145 C120 152, 95 150, 72 152 C45 154, 30 138, 28 118 C26 98, 32 88, 38 78 Z" fill="url(#liverGrad)" />
  <!-- Falciform Ligament dividing Right & Left Lobes -->
  <path d="M112 56 C110 75, 105 105, 102 148" stroke="#fed7aa" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="1 3" />
  <!-- Hepatic blood vessels -->
  <path d="M96 112 Q105 95 125 90 M102 110 Q98 90 92 80" stroke="#fca5a5" stroke-width="2.2" fill="none" stroke-linecap="round" />
  <!-- Highlight shine -->
  <path d="M52 75 C75 66, 120 66, 150 78" stroke="#ffedd5" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.4" />
</svg>