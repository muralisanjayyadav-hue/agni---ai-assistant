<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1c14" />
      <stop offset="100%" stop-color="#0f0704" />
    </linearGradient>
    <linearGradient id="colonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="smallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="24" fill="url(#gutBg)" />
  <!-- Large Intestine (Colon outer frame) -->
  <!-- Ascending Colon (Left) -->
  <path d="M42 165 C38 145, 38 100, 42 75 C45 62, 58 56, 75 56" stroke="url(#colonGrad)" stroke-width="16" fill="none" stroke-linecap="round" />
  <!-- Transverse Colon (Top) -->
  <path d="M72 56 C100 52, 125 52, 138 56" stroke="url(#colonGrad)" stroke-width="16" fill="none" stroke-linecap="round" />
  <!-- Descending & Sigmoid Colon (Right & Bottom) -->
