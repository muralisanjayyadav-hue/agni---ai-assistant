  <!-- Haustra (Colon segments lines) -->
  <path d="M38 140 L46 140 M38 115 L46 115 M38 90 L46 90 M90 50 L90 58 M115 50 L115 58 M155 90 L163 90 M155 115 L163 115 M150 140 L158 140" stroke="#ffedd5" stroke-width="2" stroke-linecap="round" />
  <!-- Small Intestine (Coiled inside center) -->
  <path d="M72 90 Q85 80 100 90 Q115 100 128 88" stroke="url(#smallGrad)" stroke-width="10" fill="none" stroke-linecap="round" />
  <path d="M68 106 Q88 118 105 105 Q122 92 134 106" stroke="url(#smallGrad)" stroke-width="10" fill="none" stroke-linecap="round" />
  <path d="M66 124 Q82 112 102 125 Q120 138 132 122" stroke="url(#smallGrad)" stroke-width="10" fill="none" stroke-linecap="round" />
  <path d="M75 142 Q92 152 110 140 Q122 132 128 144" stroke="url(#smallGrad)" stroke-width="10" fill="none" stroke-linecap="round" />
  <!-- Appendix at bottom of ascending colon -->
  <path d="M40 170 C35 178, 42 188, 48 184" stroke="#f97316" stroke-width="5" fill="none" stroke-linecap="round" />
</svg>