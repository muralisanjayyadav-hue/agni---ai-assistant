<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="sysBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <rect width="320" height="200" rx="20" fill="url(#sysBg)" stroke="#334155" stroke-width="1.5" />
  <!-- Title Badge -->
  <rect x="65" y="12" width="190" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="160" y="28" fill="#38bdf8" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">HUMAN BODY ORGAN SYSTEMS</text>
  
  <!-- System 1: Nervous System (Purple) -->
  <g transform="translate(16, 48)">
    <rect width="66" height="64" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2" />
    <text x="33" y="30" font-size="20" text-anchor="middle">🧠</text>
    <text x="33" y="46" fill="#c7d2fe" font-size="8.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">Nervous</text>
    <text x="33" y="56" fill="#818cf8" font-size="7" font-family="sans-serif" text-anchor="middle">Brain &amp; Nerves</text>
  </g>

  <!-- System 2: Circulatory System (Red) -->
  <g transform="translate(90, 48)">
    <rect width="66" height="64" rx="12" fill="#450a0a" stroke="#f87171" stroke-width="1.2" />
    <text x="33" y="30" font-size="20" text-anchor="middle">❤️</text>
    <text x="33" y="46" fill="#fecaca" font-size="8.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">Circulatory</text>
    <text x="33" y="56" fill="#f87171" font-size="7" font-family="sans-serif" text-anchor="middle">Heart &amp; Blood</text>
  </g>

  <!-- System 3: Respiratory System (Cyan) -->
  <g transform="translate(164, 48)">
    <rect width="66" height="64" rx="12" fill="#082f49" stroke="#38bdf8" stroke-width="1.2" />
    <text x="33" y="30" font-size="20" text-anchor="middle">🫁</text>
    <text x="33" y="46" fill="#bae6fd" font-size="8.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">Respiratory</text>
    <text x="33" y="56" fill="#38bdf8" font-size="7" font-family="sans-serif" text-anchor="middle">Lungs &amp; Airway</text>
  </g>

  <!-- System 4: Digestive System (Orange) -->
  <g transform="translate(238, 48)">
    <rect width="66" height="64" rx="12" fill="#431407" stroke="#fb923c" stroke-width="1.2" />
    <text x="33" y="30" font-size="20" text-anchor="middle">🫀</text>
    <text x="33" y="46" fill="#fed7aa" font-size="8.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">Digestive</text>
    <text x="33" y="56" fill="#fb923c" font-size="7" font-family="sans-serif" text-anchor="middle">Stomach &amp; Gut</text>
  </g>

  <!-- Interconnecting Arrows & Harmony Banner -->
  <path d="M50 114 L50 126 Q50 134 60 134 L150 134 M270 114 L270 126 Q270 134 260 134 L170 134" stroke="#64748b" stroke-width="1.5" fill="none" stroke-dasharray="3 3" />
  <circle cx="160" cy="134" r="5" fill="#f59e0b" />
  
  <rect x="25" y="148" width="270" height="38" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="160" y="163" fill="#f8fafc" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">All Systems Work in Perfect Homeostasis 🔄</text>
  <text x="160" y="176" fill="#94a3b8" font-size="7.5" font-family="sans-serif" text-anchor="middle">Oxygen + Nutrients + Signal Commands = Life &amp; Energy</text>
</svg>